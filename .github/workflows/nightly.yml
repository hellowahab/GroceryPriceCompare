name: nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir ./ingest

      - name: Seed DB from previous artifact (keep all stores)
        run: |
          mkdir -p data
          if curl -sfL -o data/gpc.db "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/index.sqlite"; then
            echo "seeded from previous artifact"
          else
            echo "no previous artifact yet; starting fresh"
          fi

      - name: Blink full catalogs (cheap bulk API)
        run: python -m gpc.cli run --store al_jadeed,chase_up,bin_hashim --export data/artifacts

      - name: Watch-term targeted fetch (Bin Hashim + Metro)
        run: python -m gpc.cli run --watchlist --store bin_hashim,metro --export data/artifacts

      - name: Publish artifact to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: data/artifacts
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
