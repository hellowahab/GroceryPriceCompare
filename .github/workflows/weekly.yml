name: weekly-full-crawl

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./ingest

      - name: Full crawls (Bin Hashim sitemap + Metro sitemap)
        run: python -m gpc.cli run --store bin_hashim,metro --full --export data/artifacts

      - name: Publish artifact to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: data/artifacts
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
